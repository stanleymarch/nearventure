<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9B4500" />
    <title>Nearventure</title>

    <!-- Telegram WebApp SDK — must load before app code. Injects --tg-theme-* vars. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!--
      Strip Telegram's tgWebApp* hash params BEFORE the Vue router reads them.
      Telegram appends #tgWebAppData=...&tgWebAppPlatform=... to the launch URL.
      vue-router's hash history would misread that as a route path → blank page.
      The SDK above has already parsed these into window.Telegram.WebApp.initData,
      so they are safe to remove here. Must run before main.ts (deferred module).
    -->
    <script>
      /* Best-effort pre-strip of Telegram's tgWebApp* hash params.
         The SDK may restore them; the router guard is the authoritative fix. */
      (function () {
        try {
          var raw = window.location.hash;
          if (!raw || raw.indexOf('tgWebApp') === -1) return;
          var content = raw.slice(1);
          var keep = content.split('&').filter(function (p) {
            var t = p.replace(/^\/+/, '');
            return t.length > 0 && t.indexOf('tgWebApp') !== 0;
          });
          var clean = keep.join('&') || '/';
          window.history.replaceState(null, '', '#' + (clean.charAt(0) === '/' ? clean : '/' + clean));
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Geologica (brand) + Material Symbols (category icons). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
